<!DOCTYPE html>
<html>
<head>
<title>Smart Attendance</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body { background:#f4f6f9; }
.card { border-radius:15px; }
</style>
</head>

<body class="p-3">

<div class="container">

<h3 class="text-center">📱 Smart Attendance</h3>

<!-- FORM -->
<div class="card p-3 mb-3 shadow">
<form method="POST" id="form">
    <input class="form-control mb-2" type="text" name="qr" id="qr" placeholder="Enter ID">
    <button class="btn btn-primary w-100">Mark Attendance</button>
</form>
<p class="text-center mt-2 text-success">{{ msg }}</p>
</div>

<!-- QR SCANNER -->
<div class="card p-3 mb-3 shadow">
<h5>📷 Scan QR</h5>
<div id="reader"></div>
</div>

<!-- NAV -->
<div class="text-center mb-3">
<a href="/admin">Admin</a> |
<a href="/dashboard">Dashboard</a> |
<a href="/export" class="btn btn-success btn-sm">📥 Download Excel</a> |
<a href="/logout">Logout</a>
</div>

<!-- TABLE -->
<div class="card p-3 shadow">
<h5>📊 Attendance</h5>

<table class="table table-striped">
<tr><th>ID</th><th>Name</th><th>Date</th><th>Time</th></tr>

{% for d in data %}
<tr>
<td>{{ d.id }}</td>
<td>{{ d.name }}</td>
<td>{{ d.date }}</td>
<td>{{ d.time }}</td>
</tr>
{% endfor %}

</table>
</div>

</div>

<!-- 🔥 AUTO QR SUBMIT -->
<script>
function onScanSuccess(decodedText) {
    document.getElementById("qr").value = decodedText;

    // 🔥 auto submit
    document.getElementById("form").submit();
}

new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 }).render(onScanSuccess);
</script>

<!-- 🤖 Watson Chat (paste your script here) -->
 <script>
  window.watsonAssistantChatOptions = {
    integrationID: "74820e01-140d-45f8-a5d1-a54fe419cb5d", // The ID of this integration.
    region: "https://integrations.au-syd.assistant.watson.appdomain.cloud", // The region your integration is hosted in.
    serviceInstanceID: "59ac00d5-7b76-43b2-ac1b-3ef569255722", // The ID of your service instance.
    onLoad: async (instance) => { await instance.render(); }
  };
  setTimeout(function(){
    const t=document.createElement('script');
    t.src="https://web-chat.global.assistant.watson.appdomain.cloud/versions/" + (window.watsonAssistantChatOptions.clientVersion || 'latest') + "/WatsonAssistantChatEntry.js";
    document.head.appendChild(t);
  });
</script>

</body>
</html>
